name: V1 Core System Validation
on:
  push:
    branches: ["rebuild/core-systems", "main", "refactor/kline-core-20261031"]
  pull_request:
    branches: ["main"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate core systems
        run: node scripts/validate-system.mjs

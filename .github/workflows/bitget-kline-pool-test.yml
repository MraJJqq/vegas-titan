name: Bitget 27-Instrument Kline API Test

on:
  push:
    paths:
      - 'scripts/test-bitget-kline-pool.mjs'
      - '.github/workflows/bitget-kline-pool-test.yml'
      - 'assets/js/core/market-universe.js'
      - 'assets/js/kline/kline-data.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bitget-kline-pool-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test all 27 Bitget USDT-Futures 4H contracts
        run: node scripts/test-bitget-kline-pool.mjs
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitget-27-kline-api-test
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

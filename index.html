<!doctype html>
<html lang="zh-CN">
<head>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<meta charset="utf-8">
<script>
(function(){
 'use strict';
 const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
 document.documentElement.classList.toggle('vegas-standalone',standalone);
 window.VegasRuntimeMode=Object.freeze({standalone});
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VEGAS TITAN">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png?v=vegas-metal-split-1">
<link rel="icon" type="image/svg+xml" href="./assets/icons/icon-192.svg?v=vegas-metal-split-1">
<title>VEGAS TITAN</title>
<link rel="stylesheet" href="./assets/css/app.css?v=logo-core-refactor-1">
<link rel="stylesheet" href="./assets/css/right-signal-scroll.css?v=logo-core-refactor-1">
<link rel="stylesheet" href="./assets/css/bottom-signal-ticker.css?v=cleanup-runtime-1">
</head>
<body>
<div class="app">
<div id="v9-signal-source" hidden aria-hidden="true">
<div id="v9Stocks"></div><div id="v9Core"></div>
</div>
</div>
<section id="vegas-right-scroll" aria-label="正式信号K线渐变轮播区域" hidden>
 <div class="vr-single">
  <header class="vr-head" aria-label="当前品种"><span class="vr-logo" aria-hidden="true"></span><strong class="vr-symbol"></strong></header>
  <div class="vr-error" hidden></div>
 </div>
</section>
<section id="market-cards-layer" aria-label="27个品种实时行情卡片">
  <div class="mc-columns">
    <div class="mc-side left" id="mc-left" aria-label="全部27个行情卡片，纵向滚动"></div>
  </div>
</section>
<div id="vegas-signal-ticker" aria-label="正式信号底部横向滚动播报"><div class="vst-track"><span class="vst-empty">等待正式信号</span></div></div>
<script src="./assets/js/signals/v9-events.js?v=shuffle-refresh-2&standalone-energy-3"></script>
<script src="./assets/js/core/icon-registry.js?v=logo-core-refactor-1"></script>
<script src="./assets/js/core/market-universe.js?v=central-icon-registry-1"></script>
<script src="./assets/js/core/market-data.js?v=visible-ticker-index-2&standalone-energy-2"></script>
<script src="./assets/js/cards/card-view.js?v=gesture-core-1"></script>
<script src="./assets/js/scroll/scroll-engine.js?v=velocity-handoff-1"></script>
<script src="./assets/js/cards/card-system.js?v=v1-core-1"></script>
<script src="./assets/js/kline/kline-data.js?v=ema-shared-prefix-1&standalone-energy-3"></script>
<script>
(function(){
 const sources=[
  'https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js',
  'https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js'
 ];
 function loadSource(index){
  if(index>=sources.length){console.error('[Vegas Right Scroll] chart library failed to load');return;}
  const script=document.createElement('script');script.src=sources[index];
  script.onload=function(){const chart=document.createElement('script');chart.src='./assets/js/kline/kline-chart.js?v=chart-options-cache-2';chart.onload=function(){const app=document.createElement('script');app.src='./assets/js/kline/kline-controller.js?v=logo-core-refactor-1';app.onerror=function(){console.error('[Vegas Layer 5] controller failed to load');};document.body.appendChild(app);};chart.onerror=function(){console.error('[Vegas Layer 5] chart engine failed to load');};document.body.appendChild(chart);};
  script.onerror=function(){script.remove();loadSource(index+1);};document.head.appendChild(script);
 }
 loadSource(0);
})();
</script>
<script src="./assets/js/signals/bottom-ticker.js?v=v1-core-1"></script>
</body>
</html>

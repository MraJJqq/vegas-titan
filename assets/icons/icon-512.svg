<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="sq"><rect width="1024" height="1024" rx="230"/></clipPath>
    <clipPath id="top"><rect width="1024" height="505"/></clipPath>
    <clipPath id="bot"><rect y="519" width="1024" height="505"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="46%" r="80%">
      <stop offset="0" stop-color="#4c0b1d"/>
      <stop offset=".6" stop-color="#1d0510"/>
      <stop offset="1" stop-color="#07010a"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#f3e6c8"/>
      <stop offset=".52" stop-color="#ead6a8"/>
      <stop offset="1" stop-color="#b8975e"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <text id="w" x="512" y="592" text-anchor="middle" textLength="836" lengthAdjust="spacing"
      font-family="-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif"
      font-weight="800" font-size="225" fill="url(#metal)">VEGAS</text>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g filter="url(#sh)">
      <g transform="translate(-7 0)"><g clip-path="url(#top)"><use href="#w"/></g></g>
      <g transform="translate(7 0)"><g clip-path="url(#bot)"><use href="#w"/></g></g>
    </g>
  </g>
</svg>